<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aprende a querer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 1rem;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background-color: transparent;
      color: #2C2C2C;
      overflow-x: hidden;
    }

    label {
      font-weight: 500;
      display: block;
      margin: 0.5rem 0 0.25rem;
    }

    input[type="text"] {
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 0.75rem;
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
    }

    #chat {
      padding-bottom: 1rem;
    }

    .message {
      background-color: #e6e6e6;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.9rem;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    .user-msg {
      background-color: #cccccc;
      text-align: right;
      margin-left: auto;
      margin-right: 0;
    }

    .Eldric {
      background-color: #e0d1ef;
      border-left: 4px solid #bfa2db;
    }

    .loading {
      color: #aaa;
      font-style: italic;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      html, body {
        padding: 0;
        margin: 0;
      }
      .message {
        padding: 0.7rem 0.5rem;
        font-size: 1.05rem;
        line-height: 1.7;
        border-radius: 10px;
        margin-left: 0;
        margin-right: 0;
      }
      input[type="text"] {
        margin-left: 0;
        margin-right: 0;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div id="chat"></div>
  <input type="text" id="user_message" placeholder="Escribe tu mensaje y presiona Enter...">

  <script>
    const chatDiv = document.getElementById('chat');
    const userMessageInput = document.getElementById('user_message');
    let username = "invitado"; // Default username

    // Listen for name updates from parent window
    window.addEventListener("message", (event) => {
      if (event.data?.type === "updateName") {
        username = event.data.name;
      }
    });

    function scrollToBottom() {
      setTimeout(() => {
        chatDiv.scrollTop = chatDiv.scrollHeight;
      }, 50);
    }

    function resizeIframe() {
      const height = document.body.scrollHeight;
      parent.postMessage({ type: "resize", height }, "*");
      scrollToBottom();
    }

    userMessageInput.addEventListener("keyup", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    async function sendMessage(messageText = null) {
      const userMessage = messageText || userMessageInput.value.trim();

      if (userMessage === "") return;

      // Convert single letter choices to uppercase for better recognition
      const processedMessage = userMessage.length === 1 && /[abc]/i.test(userMessage) 
        ? userMessage.toUpperCase() 
        : userMessage;

      if (!messageText) {
        chatDiv.innerHTML += `<div class="message user-msg"><strong>${username}:</strong> ${userMessage}</div>`;
        scrollToBottom();
      }

      chatDiv.innerHTML += `<div id="loading" class="loading">Eldric está pensando...</div>`;
      resizeIframe();

      try {
        console.log('Sending message:', { user_id: username, message: processedMessage });
        
        const response = await fetch('https://svetlana-api-ak3a.onrender.com/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: username, 
            message: processedMessage
          })
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', response.headers);

        document.getElementById('loading').remove();

        if (response.ok) {
          const result = await response.json();
          console.log('API Response (full):', result);
          chatDiv.innerHTML += `<div class="message Eldric">${result.response}</div>`;
          userMessageInput.value = '';
          scrollToBottom();
        } else {
          const errorText = await response.text();
          console.error('API Error Response:', errorText);
          chatDiv.innerHTML += `<div class="loading">Hubo un error al enviar el mensaje. Status: ${response.status}</div>`;
          scrollToBottom();
        }
      } catch (error) {
        console.error('Network Error:', error);
        document.getElementById('loading')?.remove();
        chatDiv.innerHTML += `<div class="loading">Error de red. Intenta de nuevo. ${error.message}</div>`;
        scrollToBottom();
      }

      resizeIframe();
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    window.addEventListener("DOMContentLoaded", () => {
      // Test API connection first
      testAPI();
      sendMessage("saludo inicial");
    });

    async function testAPI() {
      try {
        // First test if the backend is up
        const healthCheck = await fetch('https://svetlana-api-ak3a.onrender.com/');
        console.log('Backend health check status:', healthCheck.status);
        if (healthCheck.ok) {
          const healthResult = await healthCheck.json();
          console.log('Backend health check result:', healthResult);
        }

        const testResponse = await fetch('https://svetlana-api-ak3a.onrender.com/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: "test", 
            message: "test"
          })
        });
        console.log('API Test Response Status:', testResponse.status);
        if (testResponse.ok) {
          const testResult = await testResponse.json();
          console.log('API Test Result:', testResult);
        } else {
          const errorText = await testResponse.text();
          console.error('API Test Error:', errorText);
        }
      } catch (error) {
        console.error('API Test Failed:', error);
      }
    }
  </script>
</body>
</html>
