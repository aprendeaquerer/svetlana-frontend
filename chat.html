<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aprende a querer</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter&family=Montserrat:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 1rem;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      background-color: transparent;
      color: #2C2C2C;
      overflow-x: hidden;
    }

    label {
      font-weight: 500;
      display: block;
      margin: 0.5rem 0 0.25rem;
    }

    input[type="text"] {
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 0.75rem;
      width: 100%;
      box-sizing: border-box;
      font-size: 1rem;
    }

    #chat {
      padding-bottom: 1rem;
      max-height: 70vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .message {
      background-color: #e6e6e6;
      padding: 1rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      white-space: pre-wrap;
      line-height: 1.5;
      font-size: 0.9rem;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    }

    .user-msg {
      background-color: #cccccc;
      text-align: right;
      margin-left: auto;
      margin-right: 0;
    }

    .Eldric {
      background-color: #e0d1ef;
      border-left: 4px solid #bfa2db;
    }

    .loading {
      color: #aaa;
      font-style: italic;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) {
      html, body {
        padding: 0;
        margin: 0;
        height: 100vh;
        overflow: hidden;
      }
      
      #chat {
        max-height: calc(100vh - 120px);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding: 0.5rem;
      }
      
      .message {
        padding: 0.7rem 0.5rem;
        font-size: 1.05rem;
        line-height: 1.7;
        border-radius: 10px;
        margin-left: 0;
        margin-right: 0;
      }
      input[type="text"] {
        margin-left: 0;
        margin-right: 0;
        border-radius: 0;
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        z-index: 1000;
      }
    }
  </style>
</head>
<body>
  <div id="chat"></div>
  <input type="text" id="user_message" placeholder="Escribe tu mensaje y presiona Enter...">

  <script>
    const chatDiv = document.getElementById('chat');
    const userMessageInput = document.getElementById('user_message');
    let username = "invitado"; // Default username

    // Listen for name updates from parent window
    window.addEventListener("message", (event) => {
      if (event.data?.type === "updateName") {
        username = event.data.name;
      }
    });

    function scrollToBottom() {
      setTimeout(() => {
        // Try multiple scroll methods for better mobile compatibility
        chatDiv.scrollTop = chatDiv.scrollHeight;
        
        // Also try smooth scrolling
        chatDiv.scrollTo({
          top: chatDiv.scrollHeight,
          behavior: 'smooth'
        });
        
        // Force a reflow for mobile
        chatDiv.style.display = 'none';
        chatDiv.offsetHeight; // Force reflow
        chatDiv.style.display = 'block';
        chatDiv.scrollTop = chatDiv.scrollHeight;
      }, 100);
    }

    function resizeIframe() {
      const height = document.body.scrollHeight;
      parent.postMessage({ type: "resize", height }, "*");
      // Add a longer delay for mobile to ensure content is rendered
      setTimeout(() => {
        scrollToBottom();
      }, 200);
    }

    userMessageInput.addEventListener("keyup", function (event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });

    // Helper to generate UUID
    function generateUUID() {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
        var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
        return v.toString(16);
      });
    }

    function getUserId() {
      // If the username is 'invitado', use a persistent session id
      if (username === 'invitado') {
        let sessionId = localStorage.getItem('invitado_session_id');
        if (!sessionId) {
          sessionId = generateUUID();
          localStorage.setItem('invitado_session_id', sessionId);
        }
        return sessionId;
      }
      return username;
    }

    async function sendMessage(messageText = null) {
      const userMessage = messageText || userMessageInput.value.trim();

      if (userMessage === "") return;

      // Convert single letter choices to uppercase for better recognition
      const processedMessage = userMessage.length === 1 && /[abc]/i.test(userMessage) 
        ? userMessage.toUpperCase() 
        : userMessage;

      const user_id = getUserId();

      if (!messageText) {
        chatDiv.innerHTML += `<div class="message user-msg"><strong>${username}:</strong> ${userMessage}</div>`;
        scrollToBottom();
      }

      chatDiv.innerHTML += `<div id="loading" class="loading">Eldric está pensando...</div>`;
      resizeIframe();

      try {
        console.log('Sending message:', { user_id, message: processedMessage });
        
        const response = await fetch('https://svetlana-api-ak3a.onrender.com/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id, 
            message: processedMessage
          })
        });

        console.log('Response status:', response.status);
        console.log('Response headers:', response.headers);

        document.getElementById('loading').remove();

        if (response.ok) {
          const result = await response.json();
          console.log('API Response (full):', result);
          chatDiv.innerHTML += `<div class="message Eldric">${result.response}</div>`;
          userMessageInput.value = '';
          scrollToBottom();
        } else {
          const errorText = await response.text();
          console.error('API Error Response:', errorText);
          chatDiv.innerHTML += `<div class="loading">Hubo un error al enviar el mensaje. Status: ${response.status}</div>`;
          scrollToBottom();
        }
      } catch (error) {
        console.error('Network Error:', error);
        document.getElementById('loading')?.remove();
        chatDiv.innerHTML += `<div class="loading">Error de red. Intenta de nuevo. ${error.message}</div>`;
        scrollToBottom();
      }

      resizeIframe();
      chatDiv.scrollTop = chatDiv.scrollHeight;
    }

    window.addEventListener("DOMContentLoaded", () => {
      // Test API connection first
      testAPI();
      sendMessage("saludo inicial");
      
      // Ensure scroll works on page load
      setTimeout(() => {
        scrollToBottom();
      }, 500);
    });

    async function testAPI() {
      try {
        // First test if the backend is up
        const healthCheck = await fetch('https://svetlana-api-ak3a.onrender.com/');
        console.log('Backend health check status:', healthCheck.status);
        if (healthCheck.ok) {
          const healthResult = await healthCheck.json();
          console.log('Backend health check result:', healthResult);
        }

        const testResponse = await fetch('https://svetlana-api-ak3a.onrender.com/message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            user_id: "test", 
            message: "test"
          })
        });
        console.log('API Test Response Status:', testResponse.status);
        if (testResponse.ok) {
          const testResult = await testResponse.json();
          console.log('API Test Result:', testResult);
        } else {
          const errorText = await testResponse.text();
          console.error('API Test Error:', errorText);
        }
      } catch (error) {
        console.error('API Test Failed:', error);
      }
    }
  </script>
</body>
</html>
