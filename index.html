<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aprende a querer</title>
  <link rel="stylesheet" href="assets/css/vendors/bootstrap.css">
  <link rel="stylesheet" href="assets/css/landing.css">
  <style>
    :root {
      --color-primary: #F1DCF4;
      --color-secondary: #FFF6EA;
      --color-accent: #F1DCF4;
      --color-bg: #FFF6EA;
      --color-text: #042648;
      --color-border: #E0E0E0;
    }

    body {
      background-color: var(--color-bg);
      color: var(--color-text);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      padding: 0;
    }

    h1, h2 {
      color: var(--color-primary);
      font-weight: 600;
    }

    .btn-solid {
      background-color: var(--color-primary);
      color: var(--color-text);
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.25rem;
      text-decoration: none;
    }

    .btn-solid:hover {
      background-color: #e5c8f7;
    }

    .navbar {
      background-color: var(--color-secondary);
      border-bottom: 1px solid var(--color-border);
      padding: 0.5rem 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .navbar-title {
      font-weight: 700;
      font-size: 1.5rem;
      color: var(--color-text);
      text-align: center;
      flex: 1;
    }

    .navbar-buttons {
      position: absolute;
      right: 1rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .navbar-buttons a {
      margin-left: 0;
    }

    .name-input {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--color-border);
      border-radius: 6px;
      font-size: 0.9rem;
      background-color: white;
      color: var(--color-text);
    }

    .name-input::placeholder {
      color: #999;
    }

    #languageSelector {
      min-width: 80px;
    }

    .footer-content {
      background-color: var(--color-secondary);
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      color: var(--color-text);
    }

    .chat-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 0.1rem 0.5rem 0.1rem 0.5rem;
    }

    .chat-container iframe {
      width: 100%;
      border: none;
      overflow: hidden;
      min-height: 700px;
      margin-top: 0.2rem;
      margin-bottom: 0.2rem;
    }

    .message p {
      margin-top: 0.3em;
      margin-bottom: 0.3em;
    }

    .home-section {
      margin-top: 0.1rem;
      padding: 0.1rem 0;
    }

    @media (max-width: 768px) {
      body, html {
        margin: 0;
        padding: 0;
      }

      .navbar {
        padding: 0.25rem 0.5rem;
        min-height: 40px;
      }

      .navbar-title {
        font-size: 0.85rem;
        padding-right: 0.25rem;
        font-weight: 500;
      }

      .btn-solid {
        padding: 0.25rem 0.5rem;
        font-size: 0.7rem;
        border-radius: 4px;
      }

      .name-input {
        width: 70px;
        padding: 0.25rem 0.4rem;
        font-size: 0.7rem;
        border-radius: 4px;
      }

      #languageSelector {
        min-width: 60px;
        font-size: 0.7rem;
        padding: 0.25rem 0.3rem;
      }

      .navbar-buttons {
        gap: 0.25rem;
      }

      .home-section {
        margin-top: 0.5rem;
        padding: 0.25rem 0;
      }

      .container-fluid {
        padding: 0;
        margin: 0;
      }

      .home-sec, .footer-content {
        display: none;
      }

      .chat-container {
        width: 100vw;
        max-width: 100vw;
        padding: 0.05rem;
        margin: 0;
      }

      .chat-container iframe {
        width: 100vw;
        max-width: 100vw;
        margin: 0;
        min-height: calc(100vh - 60px);
      }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg d-flex align-items-center">
  <div class="navbar-title">Aprende a querer</div>
  <div class="navbar-buttons d-flex align-items-center">
    <select class="name-input" id="languageSelector" style="margin-right: 0.5rem;">
      <option value="es">Español</option>
      <option value="en">English</option>
      <option value="ru">Русский</option>
    </select>
    <a href="/login.html" class="btn-solid">Iniciar sesión</a>
    <a href="/register.html" class="btn-solid">Registrarse</a>
  </div>
</nav>

<section id="home" class="section-b-space home-section">
  <div class="container-fluid">
    <div id="chatbot">
      <div class="chat-container">
        <iframe src="/chat.html" scrolling="no" id="chatframe"></iframe>
      </div>
    </div>
  </div>
</section>

<footer>
  <div class="footer-content">
    <p>© 2024 Aprende a querer. Todos los derechos reservados.</p>
  </div>
</footer>

<script>
  // Ajuste dinámico de altura del iframe
  window.addEventListener("message", (event) => {
    const iframe = document.getElementById("chatframe");
    if (event.data?.type === "resize" && event.data?.height) {
      iframe.style.height = event.data.height + "px";
    }
  });

  // Handle name input changes and pass to iframe
  const userNameInput = document.getElementById("userNameInput");
  const languageSelector = document.getElementById("languageSelector");
  const chatFrame = document.getElementById("chatframe");

  function updateIframeData() {
    const name = userNameInput.value.trim() || "invitado";
    const language = languageSelector.value;
    
    chatFrame.contentWindow.postMessage({ 
      type: "updateData", 
      name: name,
      language: language
    }, "*");
  }

  userNameInput.addEventListener("input", updateIframeData);
  languageSelector.addEventListener("change", updateIframeData);

  // Set initial data when iframe loads
  chatFrame.addEventListener("load", function() {
    // Wait a bit for the iframe to be fully ready
    setTimeout(() => {
      updateIframeData();
      
      // Send initial greeting after iframe is loaded
      setTimeout(() => {
        chatFrame.contentWindow.postMessage({ 
          type: "sendInitialGreeting"
        }, "*");
      }, 500);
    }, 100);
  });
</script>

<script src="assets/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/landing.js"></script>
</body>
</html>
